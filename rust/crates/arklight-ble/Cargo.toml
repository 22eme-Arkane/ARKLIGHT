[package]
name = "arklight-ble"
description = "Bluetooth LE d'ARKLIGHT : le PC se fait passer pour un appareil (AsteraBox…) auprès des applis des téléphones"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# profils GATT : même forme JSON que les émulateurs JS (server/ble/emulators/)
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# Bluetooth LE de Windows (WinRT : GattServiceProvider), comme le pont Python ble/bridge.py
windows = { version = "0.62.2", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }
