[package]
name = "arklight-midi"
description = "Contrôleurs MIDI d'ARKLIGHT : messages, correspondances, préréglages, entrées Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
arklight-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# entrées MIDI de Windows (WinMM : midiInOpen avec une fonction de rappel)
windows-sys = { version = "0.61", features = ["Win32_Media_Audio"] }
